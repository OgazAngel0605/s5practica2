<!DOCTYPE html>  <!-- Establece el archivo como html -->
<html lang="en"> <!-- Permite carácteres únicamente presentes en Inglés -->

<head>
    <meta charset="UTF-8"> <!-- establece el tipo de carácteres a UTF-8, el más utilizado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- permite que la página se muestre correctamente en cualquier dispositivo -->
    <title>Salto de linea en HTML</title> <!-- Título que se mostrará en el link de la página -->
</head>

<body>
    <h1>Lenguaje de programacion</h1> <!-- Muestra el título #1 -->
    <p>En la actualidad se utilizan diferentes <!-- texto en párrafo que muestra información sobre lenguajes de programación más usados -->
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br> <!-- <br> se refiere al salto de línea, permite escribir todo el texto en un solo <p> sin necesidad de estar repitiendo la etiqueta -->
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
</body>

</html>
