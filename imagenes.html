<!DOCTYPE html> <!-- Establece el archivo como html -->
<html lang="en"> <!-- Permite carácteres únicamente presentes en Inglés -->
<head>
    <meta charset="UTF-8"> <!-- establece el tipo de carácteres a UTF-8, el más utilizado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- permite que la página se muestre correctamente en cualquier dispositivo -->
    <title>Imagenes en HTML</title> <!-- Título que se mostrará en el link de la página -->
</head>
<body>
    <h2>Imagenes en HTML</h2> <!-- Título mostrado en pantalla -->
    <h3>Locales</h3> <!-- subtítulo que hace referencia al uso de imágenes locales -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- imagen buscada en los documentos locales del sistema -->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- width y height modifican el tamaño de la imagen -->
    <h3>Desde internet</h3> <!-- Aquí se muestra como utilizar imágenes desde internet -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200" 
    alt=""> <!-- imágen buscada en base a un link -->
    <h3>Animaciones</h3> <!-- En lugar de imágen, se busca un gif -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
</body>
</html>
