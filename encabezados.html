<!DOCTYPE html> <!-- Establece el archivo como html -->
<html lang="en"> <!-- Permite carácteres únicamente presentes en Inglés -->

<head>
    <meta charset="UTF-8"> <!-- establece el tipo de carácteres a UTF-8, el más utilizado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- permite que la página se muestre correctamente en cualquier dispositivo -->
    <title>Encabezados HTML</title> <!-- Título que se mostrará en el link de la página -->
</head>

<body>
    <!-- Encabezados -->
    <!-- Se definen con la etiqueta h, seguido
  del numero correspondiente de tamaño y/o
  importancia -->
    <h1>Titulo 1</h1> <!-- Muestra el título #1 -->
    <h2>Titulo 2</h2> <!-- Muestra el título #2 -->
    <h3>Titulo 3</h3> <!-- Muestra el título #3 -->
    <h4>Titulo 4</h4> <!-- Muestra el título #4 -->
    <h5>Titulo 5</h5> <!-- Muestra el título #5 -->
    <h6>Titulo 6</h6> <!-- Muestra el título #6 -->
</body>

</html>
